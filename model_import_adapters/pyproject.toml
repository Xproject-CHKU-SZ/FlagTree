[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flagtree-model-import-adapters"
version = "0.2.0"
description = "Thin ONNX and TensorFlow import adapters for a PyTorch/TorchInductor-centered FlagTree integration path"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".venv", "server_test_results", "artifacts"]
